name: Build and Test

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build solution
      run: dotnet build --no-restore --configuration Release
      
    - name: Run unit tests
      run: dotnet test tests/StageFright.Core.Tests/StageFright.Core.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=core-tests.trx"
      
    - name: Run data access tests
      run: dotnet test tests/StageFright.Data.Tests/StageFright.Data.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=data-tests.trx"
      
    - name: Run UI tests
      run: dotnet test tests/StageFright.UI.Tests/StageFright.UI.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=ui-tests.trx"
      
    - name: Run integration tests
      run: dotnet test tests/StageFright.Integration.Tests/StageFright.Integration.Tests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=integration-tests.trx"
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          **/core-tests.trx
          **/data-tests.trx
          **/ui-tests.trx
          **/integration-tests.trx
